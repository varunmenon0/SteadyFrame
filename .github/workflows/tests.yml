name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check browser modules
        run: |
          node --check web/app.mjs
          node --check web/analysis-worker.js
      - name: Test motion estimation and crop coverage
        run: node --test web/motion.test.mjs
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev,ui]'
      - name: Check command-line entry point
        run: steadyframe --help
      - name: Run regression tests
        run: python -m pytest -q
