[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-stabilizer"
version = "0.1.0"
description = "SteadyFrame: feature-based offline video stabilization"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.8", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = ["streamlit>=1.64,<2"]

[project.scripts]
steadyframe = "video_stabilizer.cli:main"
steadyframe-ui = "video_stabilizer.launcher:main"
video-stabilizer = "video_stabilizer.cli:main"
video-stabilizer-ui = "video_stabilizer.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
